name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish to VS Code Marketplace (requires VSCE_PAT secret)'
        type: boolean
        default: false
      publish_openvsx:
        description: 'Publish to Open VSX Registry (requires OVSX_PAT secret)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Run Tests & Verification
        run: npm test

      - name: Build & Package VSIX Artifacts
        run: npm run package

      - name: List Generated VSIX Artifacts
        run: ls -lh *.vsix

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: (github.event.inputs.publish_marketplace == 'true' || startsWith(github.ref, 'refs/tags/')) && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx @vscode/vsce publish --packagePath smart-cucumber-behave-vscode-*.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX Registry
        if: (github.event.inputs.publish_openvsx == 'true' || startsWith(github.ref, 'refs/tags/')) && env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx ovsx publish smart-cucumber-behave-openvsx-*.vsix -p "$OVSX_PAT"
